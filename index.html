<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O&amp;M予定表</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* FOUC guard: apply theme before React mounts (MSAL+Firestore init delays
         first paint). Storage key must match STORAGE_KEYS.settings in
         src/context/AppContext.jsx. */
      try {
        var s = JSON.parse(localStorage.getItem('construction-schedule-settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <!-- Google Identity Services (async): used only for member 瀬戸's Google Calendar -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
