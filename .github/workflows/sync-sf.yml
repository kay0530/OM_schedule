name: Sync Salesforce Data

on:
  schedule:
    # Every 30 minutes (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Data goes to Firestore — nothing is committed to the repo.
permissions:
  contents: read

concurrency:
  group: sync-sf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > /tmp/sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth.txt --set-default
          rm /tmp/sfdx-auth.txt

      - name: Sync Salesforce data to Firestore
        env:
          # Admin SDK credential (service-account JSON) — bypasses Firestore rules.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-sf.mjs
